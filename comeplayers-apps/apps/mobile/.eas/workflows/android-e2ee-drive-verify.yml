name: Verify ComePlayers Android E2EE APK

on:
  pull_request:
    branches:
      - main
    paths:
      - comeplayers-apps/apps/mobile/.eas/workflows/android-e2ee-drive-verify.yml

jobs:
  find_android_build:
    name: Find Android APK 21
    type: get-build
    params:
      platform: android
      profile: preview
      distribution: internal
      app_identifier: com.comeplayers.app
      app_version: 0.14.0
      app_build_version: '21'
      git_commit_hash: d8ef5e480cd598860b0f120dd9787c028457537c
      wait_for_in_progress: true

  inspect_apk:
    name: Inspect APK identity and signing
    needs: [find_android_build]
    image: sdk-57
    outputs:
      artifact_exists: ${{ steps.inspect.outputs.artifact_exists }}
      apksigner_path: ${{ steps.inspect.outputs.apksigner_path }}
      aapt_path: ${{ steps.inspect.outputs.aapt_path }}
      package_name: ${{ steps.inspect.outputs.package_name }}
      version_name: ${{ steps.inspect.outputs.version_name }}
      version_code: ${{ steps.inspect.outputs.version_code }}
      size_bytes: ${{ steps.inspect.outputs.size_bytes }}
      sha256: ${{ steps.inspect.outputs.sha256 }}
      certificate_sha256: ${{ steps.inspect.outputs.certificate_sha256 }}
      identity_match: ${{ steps.inspect.outputs.identity_match }}
      certificate_match: ${{ steps.inspect.outputs.certificate_match }}
    steps:
      - uses: eas/download_build
        id: download
        with:
          build_id: ${{ needs.find_android_build.outputs.build_id }}
          extensions: [apk]

      - id: inspect
        name: Inspect downloaded APK
        run: |
          APK="${{ steps.download.outputs.artifact_path }}"
          EXISTS=false
          PACKAGE=""
          VERSION_CODE=""
          VERSION_NAME=""
          CERT=""
          SHA=""
          SIZE="0"
          IDENTITY_MATCH=false
          CERT_MATCH=false

          if [ -f "$APK" ]; then
            EXISTS=true
            SIZE="$(stat -c %s "$APK" 2>/dev/null || wc -c < "$APK" | tr -d ' ')"
            SHA="$(sha256sum "$APK" 2>/dev/null | awk '{print $1}')"
          fi

          APKSIGNER="$(command -v apksigner 2>/dev/null || true)"
          AAPT="$(command -v aapt 2>/dev/null || true)"

          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(find "${ANDROID_HOME:-/opt/android-sdk-linux}" -type f -name apksigner 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$AAPT" ]; then
            AAPT="$(find "${ANDROID_HOME:-/opt/android-sdk-linux}" -type f -name aapt 2>/dev/null | sort -V | tail -1)"
          fi

          if [ "$EXISTS" = true ] && [ -x "$AAPT" ]; then
            BADGING="$("$AAPT" dump badging "$APK" 2>/dev/null | head -n 1)"
            PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
            VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
            VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          fi

          if [ "$EXISTS" = true ] && [ -x "$APKSIGNER" ]; then
            CERT="$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          fi

          if [ "$PACKAGE" = "com.comeplayers.app" ] && [ "$VERSION_NAME" = "0.14.0" ] && [ "$VERSION_CODE" = "21" ]; then
            IDENTITY_MATCH=true
          fi
          if [ "$CERT" = "0a75bc67bf7e34ba4e80a1dbb40cd9b8a3e91c6cb2204a742b5493512bd48cf2" ]; then
            CERT_MATCH=true
          fi

          set-output artifact_exists "$EXISTS"
          set-output apksigner_path "${APKSIGNER:-missing}"
          set-output aapt_path "${AAPT:-missing}"
          set-output package_name "${PACKAGE:-unreadable}"
          set-output version_name "${VERSION_NAME:-unreadable}"
          set-output version_code "${VERSION_CODE:-unreadable}"
          set-output size_bytes "$SIZE"
          set-output sha256 "${SHA:-unreadable}"
          set-output certificate_sha256 "${CERT:-unreadable}"
          set-output identity_match "$IDENTITY_MATCH"
          set-output certificate_match "$CERT_MATCH"

  report_verification:
    name: Post APK inspection
    needs: [find_android_build, inspect_apk]
    type: github-comment
    params:
      payload: |
        ## Android APK inspection
        - Build ID: `${{ needs.find_android_build.outputs.build_id }}`
        - Artifact exists: `${{ needs.inspect_apk.outputs.artifact_exists }}`
        - aapt: `${{ needs.inspect_apk.outputs.aapt_path }}`
        - apksigner: `${{ needs.inspect_apk.outputs.apksigner_path }}`
        - Package: `${{ needs.inspect_apk.outputs.package_name }}`
        - Version: `${{ needs.inspect_apk.outputs.version_name }}`
        - versionCode: `${{ needs.inspect_apk.outputs.version_code }}`
        - Size: `${{ needs.inspect_apk.outputs.size_bytes }}` bytes
        - SHA-256: `${{ needs.inspect_apk.outputs.sha256 }}`
        - Signing certificate SHA-256: `${{ needs.inspect_apk.outputs.certificate_sha256 }}`
        - Package/version match expected release: `${{ needs.inspect_apk.outputs.identity_match }}`
        - Certificate matches existing ComePlayers release: `${{ needs.inspect_apk.outputs.certificate_match }}`
