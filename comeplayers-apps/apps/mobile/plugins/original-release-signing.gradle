// ComePlayers original release signing guard
android {
    signingConfigs {
        release {
            def releaseKeystorePath = System.getenv("COMEPLAYERS_ANDROID_KEYSTORE_PATH")
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("COMEPLAYERS_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("COMEPLAYERS_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("COMEPLAYERS_ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

// EAS injects signing credentials after prebuild using tasks.whenTaskAdded.
// Inspect the effective configuration only after the complete task graph exists.
// Configuration caching is rejected for release: it could skip this callback.
gradle.taskGraph.whenReady { graph ->
    if (!graph.allTasks.any { it.project == project && it.name.contains("Release") }) {
        return
    }
    if (gradle.startParameter.configurationCacheRequested) {
        throw new GradleException("ComePlayers release signing verification requires --no-configuration-cache.")
    }
    def signing = android.buildTypes.release.signingConfig
    if (signing == null || signing.name != "release" || signing.storeFile == null ||
        !signing.storeFile.isFile() || !signing.storePassword || !signing.keyAlias || !signing.keyPassword) {
        throw new GradleException("ComePlayers original release signing credentials are missing. Use the existing authorized keystore or EAS credentials; do not create a replacement.")
    }
    def expected = "0a75bc67bf7e34ba4e80a1dbb40cd9b8a3e91c6cb2204a742b5493512bd48cf2"
    def actual
    char[] password = signing.storePassword.toCharArray()
    try {
        // Java detects JKS/PKCS12. Read the public certificate, never log secrets.
        def store = java.security.KeyStore.getInstance(signing.storeFile, password)
        if (!store.isKeyEntry(signing.keyAlias)) {
            throw new IllegalStateException("Missing signing key entry")
        }
        def certificate = store.getCertificate(signing.keyAlias)
        actual = java.security.MessageDigest.getInstance("SHA-256")
            .digest(certificate.encoded).encodeHex().toString()
    } catch (Exception ignored) {
        // Do not attach a cause which could expose credential paths or values.
        throw new GradleException("ComePlayers release certificate could not be verified with the configured credentials.")
    } finally {
        java.util.Arrays.fill(password, (char) 0)
    }
    if (actual != expected) {
        throw new GradleException("ComePlayers release certificate does not match the original signing identity. Build stopped.")
    }
}
