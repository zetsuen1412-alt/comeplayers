plugins { id 'com.android.application' }

android {
    namespace 'id.comeplayers.boostmonitor'
    compileSdk 35

    defaultConfig {
        // The old CI debug signing key is unavailable. Install alongside v1.5;
        // never require deleting its SQLite history to accept a new certificate.
        applicationId 'id.comeplayers.boostmonitor.fh3.accounts'
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName '1.9.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        monitor {
            if (System.getenv('MONITOR_KEYSTORE_PATH')) {
                storeFile file(System.getenv('MONITOR_KEYSTORE_PATH'))
                storePassword System.getenv('MONITOR_STORE_PASSWORD')
                keyAlias 'evogaming-monitor'
                keyPassword System.getenv('MONITOR_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('MONITOR_KEYSTORE_PATH')) signingConfig signingConfigs.monitor
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.security=ALL-UNNAMED', '--add-opens=java.base/java.text=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED', '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.17'
}
