plugins { id 'com.android.application' }

android {
    namespace 'id.comeplayers.boostmonitor'
    compileSdk 35

    defaultConfig {
        applicationId 'id.comeplayers.boostmonitor'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}