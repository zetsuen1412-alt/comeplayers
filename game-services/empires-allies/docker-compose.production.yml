services:
  empires-allies:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:5005:5005"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:5005/healthz', timeout=5))['ok']"]
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 5
