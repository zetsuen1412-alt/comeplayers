name: Build EVOGAMING Monitor Windows
on:
  push:
    paths:
      - 'CP-BoostMonitor-Windows/**'
      - 'CP-BoostMonitor-Windows.Tests/**'
      - '.github/workflows/cp-boost-monitor-windows.yml'
  pull_request:
    paths:
      - 'CP-BoostMonitor-Windows/**'
      - '.github/workflows/cp-boost-monitor-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore CP-BoostMonitor-Windows/CPBoostMonitor.Windows.csproj -r win-x64
      - name: Verify pure Windows search/filter behavior
        shell: pwsh
        run: dotnet run --project CP-BoostMonitor-Windows.Tests/CPBoostMonitor.Windows.Tests.csproj -c Release
      - name: Compile native Windows app
        shell: pwsh
        run: dotnet build CP-BoostMonitor-Windows/CPBoostMonitor.Windows.csproj -c Release -r win-x64 --no-restore
      - name: Publish Windows x64 single EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish CP-BoostMonitor-Windows/CPBoostMonitor.Windows.csproj -c Release -r win-x64 --self-contained true --no-restore --no-build -p:PublishSingleFile=true -p:PublishTrimmed=false -o dist/cp-boost-monitor-windows
          $exe = "dist/cp-boost-monitor-windows/EVOGAMINGMonitor.exe"
          if (!(Test-Path $exe)) { throw "EVOGAMINGMonitor.exe not found" }
          if ((Get-Item $exe).Length -lt 3000000) { throw "EXE unexpectedly small" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "dist/cp-boost-monitor-windows/*" -DestinationPath "dist/EVOGAMING-Monitor-Windows-v1.4.0-x64.zip" -Force
          Get-FileHash -Algorithm SHA256 $exe | Format-Table
          Get-FileHash -Algorithm SHA256 "dist/EVOGAMING-Monitor-Windows-v1.4.0-x64.zip" | Format-Table
      - name: Publish Windows preview on development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/cp-boost-monitor-windows-v1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "evogaming-monitor-windows-v1.4-take-order-preview"
          $zip = "dist/EVOGAMING-Monitor-Windows-v1.4.0-x64.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            # Separate release creation from asset upload to avoid newly-created release race.
            gh release create $tag --target "$env:GITHUB_SHA" --title "EVOGAMING Monitor Windows v1.4 — DARK SOFT BLUE / TAKE ORDER" --notes "Windows 10/11 x64. Extract EVOGAMINGMonitor.exe from ZIP. Future Silver and Ice Blue UI. Preview only; sign-in with admin Payroll. Unsigned EXE may trigger Windows SmartScreen." --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Cannot create Windows preview release" }
            Start-Sleep -Seconds 8
          }
          $ok = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Warning "GitHub release upload failed ($attempt/5); waiting before retry"
            Start-Sleep -Seconds (6 * $attempt)
          }
          if (-not $ok) { throw "Windows ZIP was not uploaded. Keep the previous preview release; check GitHub artifact or retry." }
          gh release view $tag --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Failed to verify GitHub preview assets" }
      - name: Upload ZIP artifact as alternative
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/cp-boost-monitor-windows-v1'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: EVOGAMING-Monitor-Windows-v1.4-x64
          path: dist/EVOGAMING-Monitor-Windows-v1.4.0-x64.zip
          retention-days: 14
          if-no-files-found: error
      - name: Optional standalone EXE attachment
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/cp-boost-monitor-windows-v1'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "evogaming-monitor-windows-v1.4-take-order-preview"
          gh release upload $tag "dist/cp-boost-monitor-windows/EVOGAMINGMonitor.exe#EVOGAMINGMonitor-Windows-v1.4.0-PREVIEW.exe" --clobber
      - name: No production publication from pull request
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: Write-Output "PR build verified. Production Windows download is not updated."
