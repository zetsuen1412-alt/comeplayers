name: Build EVOGAMING Monitor Windows
on:
  push:
    paths:
      - 'CP-BoostMonitor-Windows/**'
      - 'CP-BoostMonitor-Windows.Tests/**'
      - 'CP-BoostMonitor-Windows.Preview/**'
      - '.github/workflows/cp-boost-monitor-windows.yml'
  pull_request:
    paths:
      - 'CP-BoostMonitor-Windows/**'
      - 'CP-BoostMonitor-Windows.Tests/**'
      - 'CP-BoostMonitor-Windows.Preview/**'
      - '.github/workflows/cp-boost-monitor-windows.yml'
  workflow_dispatch:

concurrency:
  group: monitor-native-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore CP-BoostMonitor-Windows/CPBoostMonitor.Windows.csproj -r win-x64
      - name: Verify Windows API and order behavior
        shell: pwsh
        run: dotnet run --project CP-BoostMonitor-Windows.Tests/CPBoostMonitor.Windows.Tests.csproj -c Release
      - name: Compile native Windows app
        shell: pwsh
        run: dotnet build CP-BoostMonitor-Windows/CPBoostMonitor.Windows.csproj -c Release -r win-x64 --no-restore
      - name: Render isolated synthetic UI previews at two window sizes
        shell: pwsh
        run: dotnet run --project CP-BoostMonitor-Windows.Preview/CPBoostMonitor.Windows.Preview.csproj -c Release -- dist/monitor-ui-preview
      - name: Publish Windows x64 single EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish CP-BoostMonitor-Windows/CPBoostMonitor.Windows.csproj -c Release -r win-x64 --self-contained true --no-restore --no-build -p:PublishSingleFile=true -p:PublishTrimmed=false -o dist/cp-boost-monitor-windows
          if ($LASTEXITCODE -ne 0) { throw "Windows publish failed" }
          $exe = "dist/cp-boost-monitor-windows/EVOGAMINGMonitor.exe"
          if (!(Test-Path $exe)) { throw "EVOGAMINGMonitor.exe not found" }
          if ((Get-Item $exe).Length -lt 3000000) { throw "EXE unexpectedly small" }
          if ((Get-Item $exe).Length -gt 95000000) { throw "Compressed EXE exceeds website delivery limit" }
          $probe = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList "--verify-package" -WindowStyle Hidden -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw "Published package failed isolated startup verification" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -LiteralPath $exe -DestinationPath "dist/EVOGAMING-Monitor-Windows-v2.0.8-x64.zip" -Force
          Get-FileHash -Algorithm SHA256 $exe | Format-Table
          Get-FileHash -Algorithm SHA256 "dist/EVOGAMING-Monitor-Windows-v2.0.8-x64.zip" | Format-Table
      - name: Publish Windows internal release from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "evogaming-monitor-windows-v2.0.8"
          $zip = "dist/EVOGAMING-Monitor-Windows-v2.0.8-x64.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            # Separate release creation from asset upload to avoid newly-created release race.
            gh release create $tag --target "$env:GITHUB_SHA" --title "EVOGAMING Monitor Windows" --notes "Windows 10/11 x64. Extract EVOGAMINGMonitor.exe from ZIP and close the old app before running. Telegram-inspired light interface with blue actions and dark navigation, employee names without visible codes, and elapsed sleep clocks that continue after restart. Sleep ends only when an operator changes status. Payroll view replaced by per-employee completed Telegram order counts and lists, confirmed by DONE from Monitor. Admin can delete a selected new or active order directly from its own panel without selecting a worker; the archive can be restored. Confirmed Telegram TAKE automatically marks ready/farming employees as working; manual sleep/break/offline statuses are preserved. Username login with admin, personal employee and shared workstation access. Shared accounts operate all active FH3 workers across devices without admin privileges. Admin order archives, Refund/problem status, reassignment, net wages, and immutable Tutup Buku. PAUSE and CONTINUE photo reports preserve each work cycle and block DONE until work resumes. New orders show a clickable bottom-right popup without taking focus and play a bundled ten-second music clip. Sound can be muted in Settings; a local test notification is available. Website Payroll and existing history are preserved. Internal unsigned build." --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Cannot create Windows preview release" }
            Start-Sleep -Seconds 8
          }
          $ok = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            gh release upload $tag $zip "dist/cp-boost-monitor-windows/EVOGAMINGMonitor.exe" --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Warning "GitHub release upload failed ($attempt/5); waiting before retry"
            Start-Sleep -Seconds (6 * $attempt)
          }
          if (-not $ok) { throw "Windows downloads were not uploaded. Keep the previous preview release; check GitHub artifact or retry." }
          gh release view $tag --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Failed to verify GitHub preview assets" }
      - name: Publish the same Windows binaries to website downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "dist/cp-boost-monitor-windows/EVOGAMINGMonitor.exe").Path
          $zip = (Resolve-Path "dist/EVOGAMING-Monitor-Windows-v2.0.8-x64.zip").Path
          foreach ($file in @($exe, $zip)) {
            if ((Get-Item $file).Length -gt 95000000) { throw "Windows download exceeds static file limit" }
          }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Cannot read latest main" }
          git diff --quiet "$env:GITHUB_SHA" origin/main -- CP-BoostMonitor-Windows .github/workflows/cp-boost-monitor-windows.yml website/app/admin/payroll/boost-monitor/page.tsx
          if ($LASTEXITCODE -ne 0) { throw "Monitor source changed during build; do not publish stale binaries" }
          # This checkout is an ephemeral CI clone. Keep unrelated newer main changes.
          git checkout -B main origin/main
          if ($LASTEXITCODE -ne 0) { throw "Cannot prepare download publication" }
          $downloads = "website/public/downloads"
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          Copy-Item -LiteralPath $exe -Destination "$downloads/evogaming-monitor-windows.exe"
          Copy-Item -LiteralPath $zip -Destination "$downloads/evogaming-monitor-windows.zip"
          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  evogaming-monitor-windows.exe`n$zipHash  evogaming-monitor-windows.zip" | Set-Content "$downloads/evogaming-monitor-windows.sha256"
          @{ version = "2.0.8"; sourceCommit = $env:GITHUB_SHA; exeSha256 = $exeHash; zipSha256 = $zipHash;
             exeBytes = (Get-Item $exe).Length; zipBytes = (Get-Item $zip).Length } |
            ConvertTo-Json | Set-Content "$downloads/evogaming-monitor-windows.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$downloads/evogaming-monitor-windows.exe" "$downloads/evogaming-monitor-windows.zip" "$downloads/evogaming-monitor-windows.sha256" "$downloads/evogaming-monitor-windows.json"
          if ($LASTEXITCODE -ne 0) { throw "Cannot stage verified Windows downloads" }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build(windows): publish verified Monitor website downloads"
            if ($LASTEXITCODE -ne 0) { throw "Cannot commit Windows downloads" }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Cannot publish Windows downloads; keep existing site files" }
          }
      - name: Verify public website Windows downloads without GitHub login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://www.comeplayers.com/downloads/evogaming-monitor-windows"
          $ready = $false
          for ($attempt = 1; $attempt -le 25; $attempt++) {
            try {
              $metadata = Invoke-RestMethod -Uri "$base.json?build=$env:GITHUB_SHA" -TimeoutSec 15
              if ($metadata.sourceCommit -eq $env:GITHUB_SHA) { $ready = $true; break }
            } catch { Write-Host "Website publication not ready ($attempt/25)" }
            Start-Sleep -Seconds 12
          }
          if (-not $ready) { throw "Website has not published this Windows build" }
          foreach ($extension in @("exe", "zip")) {
            $target = "dist/downloaded-monitor.$extension"
            $response = Invoke-WebRequest -Uri "$base.$extension`?build=$env:GITHUB_SHA" -OutFile $target -PassThru -TimeoutSec 120
            $expected = if ($extension -eq "exe") { $metadata.exeSha256 } else { $metadata.zipSha256 }
            $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected -or "$($response.Headers['Content-Disposition'])" -notmatch '^attachment') {
              throw "Public Windows $extension failed checksum or attachment verification"
            }
            Write-Host "Public Windows $extension attachment and SHA-256 verified: $actual"
          }
      - name: Upload ZIP artifact as alternative
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: EVOGAMING-Monitor-Windows-v2.0.8-x64
          path: dist/EVOGAMING-Monitor-Windows-v2.0.8-x64.zip
          retention-days: 14
          if-no-files-found: error
      - name: No production publication from pull request
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: Write-Output "PR build verified. Production Windows download is not updated."
