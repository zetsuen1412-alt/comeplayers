name: Verify CP Boost Monitor direct assignment and photo proof
on:
  pull_request:
    paths:
      - 'website/app/api/admin/payroll/mobile/**'
      - 'website/features/payroll/lib/google-sheet-sync.ts'
      - 'website/supabase/migrations/2026101922000*_cp_boost_monitor*.sql'
      - 'website/tests/payroll-mobile-assignment*.test.ts'
      - 'website/tests/fh3-manual-telegram.test.ts'
      - 'website/tests/fh3-manual-telegram-database.test.ts'
      - 'website/tests/fh3-manual-telegram-intake.test.ts'
      - 'website/supabase/migrations/*_fh3_monitor_source_guards.sql'
      - 'website/lib/fh3ManualTelegram*.ts'
      - 'website/app/api/integrations/telegram/payroll/route.ts'
      - 'website/supabase/migrations/20261022070000_fh3_manual_telegram_intake.sql'
      - 'website/tests/payroll-mobile-direct-routing.test.ts'
      - 'website/tests/payroll-mobile-proof-database.test.ts'
      - 'website/tests/payroll-mobile-proof-api.test.ts'
      - 'website/tests/payroll-mobile-take.test.ts'
      - 'website/app/api/admin/payroll/mobile/take/**'
      - 'website/lib/payrollMobileTake.ts'
      - 'website/supabase/migrations/20261020140000_fh3_take_before_photo_start.sql'
      - 'website/tests/payroll-mobile-proof-group.test.ts'
      - 'website/tests/payroll-mobile-proof-setup.test.ts'
      - 'website/tests/payroll-telegram-*.test.ts'
      - 'website/lib/payrollMobileProof.ts'
      - '.github/workflows/cp-boost-direct-assignment-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-payroll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test website API and PostgreSQL migrations
        run: >-
          npx --no-install tsx --test
          tests/fh3-manual-telegram.test.ts
          tests/fh3-manual-telegram-database.test.ts
          tests/fh3-manual-telegram-intake.test.ts
          tests/payroll-mobile-assignment.test.ts
          tests/payroll-mobile-assignment-database.test.ts
          tests/payroll-mobile-direct-routing.test.ts
          tests/payroll-mobile-proof-database.test.ts
          tests/payroll-mobile-proof-api.test.ts
          tests/payroll-mobile-take.test.ts
          tests/payroll-mobile-proof-group.test.ts
          tests/payroll-mobile-proof-setup.test.ts
          tests/payroll-telegram-*.test.ts
      - name: Resolve mobile crypto dependencies for existing shared typecheck
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const web=require('./package.json');
          const mobile=require('../comeplayers-apps/apps/mobile/package.json');
          for(const name of ['hpke','@panva/hpke-noble','@noble/curves','@noble/ciphers','@noble/hashes']){
            if(web.dependencies[name]!==mobile.dependencies[name])throw Error('Crypto version mismatch: '+name);
            const target=path.resolve('node_modules',name);
            const link=path.resolve('../comeplayers-apps/apps/mobile/node_modules',name);
            if(!fs.existsSync(target))throw Error('Dependency missing: '+name);
            fs.mkdirSync(path.dirname(link),{recursive:true});
            if(!fs.existsSync(link))fs.symlinkSync(target,link,'dir');
          }
          NODE
      - name: Typecheck website
        run: npm run typecheck
