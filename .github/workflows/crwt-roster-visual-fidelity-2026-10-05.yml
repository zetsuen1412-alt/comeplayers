name: CRWT Roster Visual Fidelity 2026-10-05
on:
  workflow_dispatch:
  push:
    branches:
      - codex/crazy-rich-web-v30
    paths:
      - .github/workflows/crwt-roster-visual-fidelity-2026-10-05.yml
      - Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-visual-fidelity-2026-10-05/**
      - Crazy-Rich-World-Tour-Unity-28.0/Web30/checkpoints/2026-10-05-roster-visual-fidelity/**
      - CRWT_ROSTER_VISUAL_FIDELITY_RESUME_ID.md
permissions:
  contents: read
env:
  # Frozen ten-model fidelity gallery; eight changed models, Rindi/Pip preserved.
  # The builder checks this against the frozen source receipt and generated bytes.
  ROSTER_GALLERY_SHA256: f1d134dfb67d581eef797ca4200f6dd01d2ec7cda11ba92dc91397bc21396998
  ROSTER: Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-visual-fidelity-2026-10-05
  INVENTORY: Crazy-Rich-World-Tour-Unity-28.0/Web30/checkpoints/2026-10-05-roster-visual-fidelity/inventory.json
jobs:
  verify-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize exact source Git blobs without checkout line-ending filters
        run: >-
          python3 "$ROSTER/tools/materialize_git_snapshot.py" --repo-root . --inventory "$INVENTORY"
          --out-dir crwt-visual-fidelity-raw-source --expected-commit "$GITHUB_SHA" --receipt crwt-visual-fidelity-materialization.json
      - name: Verify complete source inventory and every frozen baseline blob
        working-directory: crwt-visual-fidelity-raw-source
        run: >-
          python3 "$ROSTER/tools/verify_checkpoint.py" --root .
          --manifest "$INVENTORY" --strict-bytes --receipt crwt-visual-fidelity-source-verification.json
      - name: Verify ten actual candidate GLBs without generation
        working-directory: crwt-visual-fidelity-raw-source
        run: >-
          python3 "$ROSTER/tools/validate_roster_candidate.py" "$ROSTER/review-manifest.json"
          --receipt crwt-visual-fidelity-roster-validation.json
      - name: Restore pinned native ZIP from two Git parts and verify SHA256 plus CRC
        working-directory: crwt-visual-fidelity-raw-source
        # Full ZIP SHA256: 966c135bd63115bbec746c21d30ef6f1ff33d4e6bf5d195c4975da57d470199a
        # --receipt is the frozen INPUT manifest; --report is a fresh OUTPUT.
        run: >-
          python3 "$ROSTER/tools/restore_native_archive.py" --parts-dir "$ROSTER/editable"
          --output crwt-visual-fidelity-native-restore/CRWT-fidelity-editable-roster.zip
          --receipt "$ROSTER/editable/git-native-storage-receipt.json"
          --report crwt-visual-fidelity-native-restore.json
      - name: Rebuild exact offline gallery and preserve frozen receipt bytes
        working-directory: crwt-visual-fidelity-raw-source
        run: >-
          python3 "$ROSTER/tools/rebuild_and_verify_gallery.py" --roster "$ROSTER"
          --build-dir crwt-visual-fidelity-gallery-build --expected-sha256 "$ROSTER_GALLERY_SHA256"
      - name: Archive complete preserved source and visual-fidelity review assets
        working-directory: crwt-visual-fidelity-raw-source
        run: >-
          python3 "$ROSTER/tools/archive_source_checkpoint.py" --root . --inventory "$INVENTORY"
          --roster "$ROSTER" --output crwt-roster-visual-fidelity-2026-10-05-source.zip
          --receipt crwt-roster-visual-fidelity-2026-10-05-source-receipt.json
          --commit "$GITHUB_SHA" --expected-gallery-sha256 "$ROSTER_GALLERY_SHA256"
      - name: Save private portable source checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: CRWT-Roster-Visual-Fidelity-Source-2026-10-05-${{ github.sha }}
          path: |
            crwt-visual-fidelity-raw-source/crwt-roster-visual-fidelity-2026-10-05-source.zip
            crwt-visual-fidelity-raw-source/crwt-roster-visual-fidelity-2026-10-05-source-receipt.json
            crwt-visual-fidelity-raw-source/crwt-visual-fidelity-source-verification.json
            crwt-visual-fidelity-raw-source/crwt-visual-fidelity-roster-validation.json
            crwt-visual-fidelity-raw-source/crwt-visual-fidelity-native-restore.json
            crwt-visual-fidelity-materialization.json
          retention-days: 7
          if-no-files-found: error
