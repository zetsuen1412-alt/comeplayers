name: Payroll sheet transfer and book cutover checks
on:
  pull_request:
    paths:
      - website/features/payroll/lib/google-sheet-sync.ts
      - website/features/payroll/lib/legacy-fh-cutover.ts
      - website/features/payroll/components/legacy-fh-archive.tsx
      - website/app/admin/payroll/bookkeeping/**
      - website/scripts/comeplayers-payroll-google-sheets.gs
      - website/tests/payroll-legacy-x2754-cutover.test.ts
      - website/features/payroll/lib/google-sheet-daily.ts
      - website/features/payroll/lib/sheet-transfer-payroll.ts
      - website/features/payroll/lib/sheet-code-collision.ts
      - website/features/payroll/lib/daily-orders.ts
      - website/features/payroll/lib/payroll-live.ts
      - website/features/payroll/lib/workspace-model.ts
      - website/features/payroll/types/domain.ts
      - website/features/payroll/components/fortnight-closing.tsx
      - website/app/admin/payroll/mutations/**
      - website/tests/payroll-transfer-cutover-conflicts.test.ts
      - .github/workflows/payroll-transfer-cutover-checks.yml
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Resolve mobile crypto dependencies for existing shared typecheck
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const web=require('./package.json');
          const mobile=require('../comeplayers-apps/apps/mobile/package.json');
          for(const name of ['hpke','@panva/hpke-noble','@noble/curves','@noble/ciphers','@noble/hashes']){
            if(web.dependencies[name]!==mobile.dependencies[name])throw Error('Crypto version mismatch: '+name);
            const target=path.resolve('node_modules',name);
            const link=path.resolve('../comeplayers-apps/apps/mobile/node_modules',name);
            if(!fs.existsSync(target))throw Error('Dependency missing: '+name);
            fs.mkdirSync(path.dirname(link),{recursive:true});
            if(!fs.existsSync(link))fs.symlinkSync(target,link,'dir');
          }
          NODE
      - name: Typecheck
        run: npm run typecheck
      - name: Verify transfer and daily payroll safety
        run: npx --no-install tsx --test tests/payroll-legacy-x2754-cutover.test.ts tests/payroll-transfer-cutover-conflicts.test.ts tests/payroll-google-sheet-sync.test.ts tests/payroll-google-sheet-daily.test.ts tests/payroll-daily-orders.test.ts tests/payroll-final-workspace.test.ts
