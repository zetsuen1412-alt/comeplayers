name: Indonesian admin review
on:
  push:
    branches: [chatgpt/admin-indonesian]
    paths:
      - '.github/workflows/admin-locale-review.yml'
      - '.github/admin-locale/**'
permissions:
  contents: write
concurrency:
  group: admin-indonesian-review
  cancel-in-progress: true
jobs:
  verify-admin-locale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            website
            comeplayers-apps
            .github
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm ci --prefix website --no-audit --no-fund
          npm ci --prefix comeplayers-apps --no-audit --no-fund
      - name: Capture original admin machine contracts
        working-directory: website
        run: npx --no-install tsx ../.github/admin-locale/baseline.ts
      - name: Apply readable Indonesian copy changes
        run: python3 .github/admin-locale/apply.py
      - name: Full website typecheck
        working-directory: website
        run: npm run typecheck
      - name: Locale and payment/payroll regression tests
        working-directory: website
        run: npx --no-install tsx --test tests/adminLocale.test.ts tests/payroll-access.test.ts tests/payroll-final-workspace.test.ts tests/cpWallet.test.ts tests/marketplacePricing.test.ts tests/localizationCurrency.test.ts tests/paypalCheckout.test.ts tests/paymentCurrency.test.tsx
      - name: Install isolated browser
        working-directory: website
        run: npx --no-install playwright install --with-deps chromium
      - name: Desktop and mobile admin fixtures (no production access)
        working-directory: website
        run: node --test tests/adminLocale.browser.mjs
      - name: Build without production credentials
        working-directory: website
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-production-key
        run: npm run build
      - name: Save verified source only to the isolated review branch
        run: |
          test "$GITHUB_REF_NAME" = "chatgpt/admin-indonesian"
          python3 - <<'PY'
          import json, subprocess
          paths = json.load(open('.github/admin-locale/changed-paths.json'))
          subprocess.run(['git', 'add', '--', *paths], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines()
          if not staged or not set(staged).issubset(set(paths)):
              raise SystemExit('Unexpected staged paths; refusing to commit.')
          PY
          git config user.name 'ComePlayers CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(admin): verify Indonesian administration interface'
          git push origin HEAD:refs/heads/chatgpt/admin-indonesian
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-indonesian-verification
          retention-days: 3
          path: |
            website/test-results/admin-locale
            .github/admin-locale/changed-paths.json
          if-no-files-found: ignore
