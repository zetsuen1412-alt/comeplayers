name: Admin locale review
on:
  push:
    branches: [chatgpt/admin-indonesian]
    paths: ['.github/workflows/admin-locale-review.yml']
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            website/app
            website/components
            website/features
            website/hooks
            website/lib
            website/tests
            website/types
            website/scripts
            .github/workflows
      - name: Package tracked source only (no credentials or user data)
        shell: bash
        run: |
          mkdir -p admin-locale-review
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          roots = ('website/app/', 'website/components/', 'website/features/', 'website/hooks/', 'website/lib/', 'website/tests/', 'website/types/', 'website/scripts/', '.github/workflows/')
          files = {'website/AGENTS.md', 'website/package.json', 'website/package-lock.json', 'website/tsconfig.json', 'website/next.config.ts'}
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with tarfile.open('admin-locale-review/source.tar', 'w') as archive:
              for name in paths:
                  path = pathlib.Path(name)
                  if (name in files or name.startswith(roots)) and path.is_file() and not path.is_symlink():
                      archive.add(path, arcname=name, recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: admin-locale-source
          path: admin-locale-review/source.tar
          retention-days: 1
          if-no-files-found: error
