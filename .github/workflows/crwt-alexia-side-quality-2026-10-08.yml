name: CRWT Alexia Side Quality 2026-10-08
on:
  workflow_dispatch:
  push:
    branches: [codex/crazy-rich-web-v30]
    paths:
      - .github/workflows/crwt-alexia-side-quality-2026-10-08.yml
      - Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-side-quality-2026-10-08/**
      - CRWT_ALEXIA_SIDE_QUALITY_RESUME_ID.md
permissions:
  contents: read
env:
  ROSTER: Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-side-quality-2026-10-08
jobs:
  verify-side-quality-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install explicit numeric source-gate dependency
        run: python3 -m pip install numpy==2.3.5
      - name: Restore exact source inventory and check all ten models and selected source gate
        run: >-
          python3 -B "$ROSTER/tools/restore_side_quality.py"
          --out-dir crwt-side-quality-review --receipt crwt-side-quality-source-restore.json
          --verify-models --verify-source-gate
      - name: Write verified actual JSON proofs to job summary
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          candidate = "e18cc26d9662d5ec615fa636150b5f4eddaab9c8ca4c2b3b1ea702bf1d50efca"
          paths = [Path("crwt-side-quality-source-restore.json"), Path("crwt-side-quality-review-source-gate.json")]
          verified = []
          for path in paths:
              raw = path.read_text(encoding="utf-8")
              proof = json.loads(raw)
              if proof.get("passed") is not True:
                  raise SystemExit(f"Actual proof did not pass: {path}")
              if proof.get("candidate_sha256") != candidate:
                  raise SystemExit(f"Actual proof selected candidate differs: {path}")
              verified.append((path.name, raw))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Verified Alexia side-quality source proofs\n\n")
              for name, raw in verified:
                  summary.write(f"### {name}\n\n```json\n{raw.rstrip()}\n```\n\n")
          PY
