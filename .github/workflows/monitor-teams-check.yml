name: Verify Monitor teams and wage splits
on:
  pull_request:
    paths:
      - 'website/app/api/admin/payroll/mobile/**'
      - 'website/lib/monitor*.ts'
      - 'website/lib/payrollMobile*.ts'
      - 'website/supabase/migrations/**'
      - 'website/tests/monitor*.ts'
      - 'website/tests/payroll-mobile*.ts'
      - '.github/workflows/monitor-teams-check.yml'
  push:
    branches: [main]
    paths:
      - 'website/app/api/admin/payroll/mobile/**'
      - 'website/lib/monitor*.ts'
      - 'website/lib/payrollMobile*.ts'
      - 'website/supabase/migrations/**'
      - 'website/tests/monitor*.ts'
      - 'website/tests/payroll-mobile*.ts'
      - '.github/workflows/monitor-teams-check.yml'
permissions:
  contents: read
jobs:
  teams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Verify Monitor API, team database upgrade and legacy workflows
        run: node --import tsx --test --test-concurrency=1 tests/monitor-*.test.ts tests/payroll-mobile-*.test.ts
