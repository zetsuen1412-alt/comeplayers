name: CRWT Portable Character Workspace
on:
  workflow_dispatch:
  push:
    branches:
      - codex/crazy-rich-web-v30
    paths:
      - .github/workflows/crwt-portable-character-workspace.yml
      - Crazy-Rich-World-Tour-Unity-28.0/Web30/production/**
      - Crazy-Rich-World-Tour-Unity-28.0/Web30/checkpoints/**
      - Crazy-Rich-World-Tour-Unity-28.0/Web30/client/**
      - Crazy-Rich-World-Tour-Unity-28.0/Web30/tools/**
      - Crazy-Rich-World-Tour-Unity-28.0/Web30/pwa/**
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify current source and preserved checkpoint assets
        run: python3 Crazy-Rich-World-Tour-Unity-28.0/Web30/tools/verify_checkpoint.py
      - name: Verify ten actual reference-based candidate models
        run: >-
          python3 Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-reference-2026-10-04/tools/validate_roster_candidate.py
          Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-reference-2026-10-04/review-manifest.json
          --receipt crwt-roster-validation.json
      - name: Rebuild the offline ten-character gallery without cloud generation
        run: >-
          python3 Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-reference-2026-10-04/viewer/build_offline_gallery.py
          --manifest Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-reference-2026-10-04/review-manifest.json
          --expected-output-sha256 2f2a53f24be0cef8ee9c6b9c54fff5d56250715b788676bbbeb608938e00ff7d
          --output Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-reference-2026-10-04/BUKA-REVIEW-MODEL.html
      - name: Rebuild exact front projection diagnostic with Python stdlib
        working-directory: Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/alexia/continuation-2026-10-04
        run: >-
          python3 tools/rebuild_front_projection.py
          ../v11-hunyuan21-diagnostic/alexia-v11-hunyuan21-untextured-diagnostic.glb
          ../nano-banana-ui-review/nano-banana-front-capture.jpg
          --selection tools/front-face-selection.json
          --out front-projection/alexia-v11-front-projection-diagnostic.glb
          --proof front-projection/alexia-v11-front-projection-diagnostic.ci-rebuild-proof.json
      - name: Rebuild source-preserving interior cleanup candidate
        working-directory: Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/alexia/interior-cleanup-2026-10-04
        run: >-
          python3 tools/build_interior_cleanup_candidate.py
          ../v11-hunyuan21-diagnostic/alexia-v11-hunyuan21-untextured-diagnostic.glb
          --containment-proof containment-proof-exact.json
          --containment-proof-sha256 1c28f04907e44fd9b0a0f2169854e19a06bd4a26ca495074a19219c6be599935
          --confirm-proven-interior-candidate
          --expected-output-sha256 dae2b0784b190649e5ae69ef2854aa06798468d2244eb5982d61a759c0c54af0
          --out candidate/alexia-v11-interior-cleanup-candidate.glb
          --proof candidate/alexia-v11-interior-cleanup-candidate.ci-cleanup-proof.json
      - name: Rebuild standalone offline inspection viewer from frozen vendor bundle
        working-directory: Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/alexia/interior-cleanup-2026-10-04
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,sys
          subprocess.run([sys.executable,'viewer/build_offline_viewer.py',
            '--vendor-bundle','viewer/viewer-vendor-bundle.json',
            '--original','../v11-hunyuan21-diagnostic/alexia-v11-hunyuan21-untextured-diagnostic.glb',
            '--projection','../continuation-2026-10-04/front-projection/alexia-v11-front-projection-diagnostic.glb',
            '--cleanup','candidate/alexia-v11-interior-cleanup-candidate.glb',
            '--cleanup-note',pathlib.Path('viewer/cleanup-note.txt').read_text(encoding='utf-8'),
            '--expected-output-sha256','257e2d0ffa08fb43574310e9ec871b7730bfdcf5143de0ebfa133a65f3fade8c',
            '--output','viewer/BUKA-INSPEKSI-ALEXIA.html'],check=True)
          PY
      - name: Rebuild front projection on certified interior candidate
        working-directory: Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/alexia/surface-review-2026-10-04
        run: >-
          python3 tools/build_cleanup_front_projection.py
          ../interior-cleanup-2026-10-04/candidate/alexia-v11-interior-cleanup-candidate.glb
          ../nano-banana-ui-review/nano-banana-front-capture.jpg
          --baseline-projection ../continuation-2026-10-04/front-projection/alexia-v11-front-projection-diagnostic.glb
          --remap ../interior-cleanup-2026-10-04/candidate/alexia-v11-interior-cleanup-candidate.front-selection-remap.json
          --expected-output-sha256 4fd3724ec128557e089dea2e78a48873f9ba1140cd80eadbbee38c00df43c599
          --out models/alexia-v11-cleanup-front-projection-candidate.glb
          --proof models/alexia-v11-cleanup-front-projection-candidate.ci-projection-proof.json
      - name: Rebuild separately labeled exterior ablation review variant
        working-directory: Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/alexia/surface-review-2026-10-04
        run: >-
          python3 tools/build_exterior_ablation_candidate.py
          --original ../v11-hunyuan21-diagnostic/alexia-v11-hunyuan21-untextured-diagnostic.glb
          --base-candidate ../interior-cleanup-2026-10-04/candidate/alexia-v11-interior-cleanup-candidate.glb
          --cleanup-proof ../interior-cleanup-2026-10-04/candidate/alexia-v11-interior-cleanup-candidate.cleanup-proof.json
          --selection exterior-ablation-selection.json
          --selection-sha256 953b5fefef44c75bc28195c5606ec6f65aeb9844b2f9ea084c4b8d3d2a90d85e
          --confirm-exterior-ablation-review
          --expected-output-sha256 6ae8b914b7c3a573d1335a54bc2875ab05df0e82d1442054b4820e28602d2cac
          --out models/alexia-v11-exterior-ablation-review-candidate.glb
          --proof models/alexia-v11-exterior-ablation-review-candidate.ci-ablation-proof.json
      - name: Rebuild compressed offline revision viewer and preserved V2 reference
        working-directory: Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/alexia/surface-review-2026-10-04
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,sys
          subprocess.run([sys.executable,'viewer/build_offline_viewer.py',
            '--vendor-bundle','../interior-cleanup-2026-10-04/viewer/viewer-vendor-bundle.json',
            '--original','../v11-hunyuan21-diagnostic/alexia-v11-hunyuan21-untextured-diagnostic.glb',
            '--projection','models/alexia-v11-cleanup-front-projection-candidate.glb',
            '--cleanup','models/alexia-v11-exterior-ablation-review-candidate.glb',
            '--cleanup-note',pathlib.Path('viewer/exterior-note.txt').read_text(encoding='utf-8'),
            '--reference-v2','../../../turnarounds/alexia/turnaround-blue-imagegen-v2.png',
            '--expected-output-sha256','1f72bd921c907920a47134bc083de69f8991e1d877fb5343ffe3f474e0061158',
            '--output','viewer/BUKA-REVISI-ALEXIA.html'],check=True)
          PY
      - name: Archive preserved models, references and editable sources
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile,os,sys
          root=pathlib.Path('.').resolve()
          source=root/'Crazy-Rich-World-Tour-Unity-28.0/Web30'
          target=root/'crwt-portable-character-workspace.zip'
          files=sorted(p for p in source.rglob('*') if p.is_file())
          diagnostic=source/'production/reconstruction/alexia/continuation-2026-10-04'
          current=source/'production/reconstruction/alexia/interior-cleanup-2026-10-04'
          review=source/'production/reconstruction/alexia/surface-review-2026-10-04'
          verifier=(diagnostic/'tools/verify_portable_workspace.py').read_bytes()
          latest=source/'checkpoints/2026-10-04-roster-reference/PORTABLE_GUIDE_ID.txt'
          guide=('Commit: '+os.environ['GITHUB_SHA']+'\n\n').encode()+(latest if latest.is_file() else review/'PORTABLE_GUIDE_ID.txt').read_bytes()
          extras={'verify_portable_workspace.py':verifier,'MULAI-DI-SINI.txt':guide}
          records=[]
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in files:
                  assert p.resolve().is_relative_to(source.resolve())
                  assert p.name == '.env.example' or not p.name.startswith('.env')
                  name=p.relative_to(root).as_posix()
                  data=p.read_bytes()
                  z.writestr(name,data)
                  records.append({'path':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              for name,data in extras.items():
                  z.writestr(name,data)
                  records.append({'path':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              manifest={'schema':'crwt.web30.portable.v1','scope':'Web30 with preserved models and continuation diagnostics; excludes surrounding Unity project and website mirrors','continuation_commit':os.environ['GITHUB_SHA'],'files':sorted(records,key=lambda r:r['path']),'excluded_from_hash':['portable-manifest.json (self-referential)']}
              z.writestr('portable-manifest.json',json.dumps(manifest,indent=2)+'\n')
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None
              for record in records:
                  data=z.read(record['path'])
                  assert len(data)==record['bytes'] and hashlib.sha256(data).hexdigest()==record['sha256']
          candidate=current/'candidate/alexia-v11-interior-cleanup-candidate.glb'
          viewer=current/'viewer/BUKA-INSPEKSI-ALEXIA.html'
          colored=review/'models/alexia-v11-cleanup-front-projection-candidate.glb'
          exterior=review/'models/alexia-v11-exterior-ablation-review-candidate.glb'
          latest_viewer=review/'viewer/BUKA-REVISI-ALEXIA.html'
          roster=source/'production/reconstruction/roster-reference-2026-10-04'
          roster_manifest=json.loads((roster/'review-manifest.json').read_text())
          receipt={'commit':os.environ['GITHUB_SHA'],'files':len(records)+1,'sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'bytes':target.stat().st_size,'mesh_generation':True,'cloud_generation_in_ci':False,'reference_candidate_models':len(roster_manifest['models']),'roster_visual_approved':False,'roster_game_integrated':False,'roster_viewer_sha256':hashlib.sha256((roster/'BUKA-REVIEW-MODEL.html').read_bytes()).hexdigest(),'diagnostic_rebuilt_from_frozen_selection':True,'cleanup_candidate_sha256':hashlib.sha256(candidate.read_bytes()).hexdigest(),'cleanup_projection_sha256':hashlib.sha256(colored.read_bytes()).hexdigest(),'exterior_ablation_sha256':hashlib.sha256(exterior.read_bytes()).hexdigest(),'offline_viewer_sha256':hashlib.sha256(latest_viewer.read_bytes()).hexdigest(),'previous_inspection_viewer_sha256':hashlib.sha256(viewer.read_bytes()).hexdigest(),'game_assets_changed':False,'zip_crc_and_member_hashes_valid':True}
          (root/'crwt-portable-character-workspace-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - name: Save private portable workspace
        uses: actions/upload-artifact@v4
        with:
          name: CRWT-Portable-Character-Workspace-${{ github.sha }}
          path: |
            crwt-portable-character-workspace.zip
            crwt-portable-character-workspace-receipt.json
            crwt-roster-validation.json
          retention-days: 7
          if-no-files-found: error
