name: Build CP Boost Monitor APK
on:
  push:
    paths:
      - 'CP-BoostMonitor-Android/**'
      - '.github/workflows/cp-boost-monitor-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" || ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            (yes y || true) | "$SDKMANAGER" --licenses
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android APK
        run: gradle --no-daemon -p CP-BoostMonitor-Android assembleDebug
      - name: Verify APK format and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="CP-BoostMonitor-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Publish same APK to website downloads
        # The PR branch publishes the downloadable APK; main keeps that exact, reviewed binary.
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          APK="CP-BoostMonitor-Android/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p website/public/downloads
          cp "$APK" website/public/downloads/cp-boost-monitor.apk
          # ZIP fallback allows Android users to download from embedded browsers blocking .apk.
          cp "$APK" website/public/downloads/CP-Boost-Monitor.apk
          (cd website/public/downloads && zip -q cp-boost-monitor.zip CP-Boost-Monitor.apk)
          rm website/public/downloads/CP-Boost-Monitor.apk
          (cd website/public/downloads && sha256sum cp-boost-monitor.apk > cp-boost-monitor.apk.sha256)
          unzip -t website/public/downloads/cp-boost-monitor.zip | tail -n 1
          echo "ZIP includes the same APK verified by apksigner."
          test "$(unzip -p website/public/downloads/cp-boost-monitor.zip CP-Boost-Monitor.apk | sha256sum | cut -d' ' -f1)" = "$(sha256sum "$APK" | cut -d' ' -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f website/public/downloads/cp-boost-monitor.apk
          git add -f website/public/downloads/cp-boost-monitor.apk.sha256
          git add -f website/public/downloads/cp-boost-monitor.zip
          if ! git diff --cached --quiet; then
            git commit -m "build(android): publish verified CP Boost Monitor APK for website admins"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Publish internal debug APK to GitHub Releases
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="cp-boost-monitor-android-v1.2-debug"
          APK="CP-BoostMonitor-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#CP-BoostMonitor-v1.2-debug.apk" --clobber
          else
            gh release create "$TAG" "$APK#CP-BoostMonitor-v1.2-debug.apk" \
              --target "$GITHUB_SHA" \
              --title "CP Boost Monitor Android v1.2 (internal debug)" \
              --notes "APK debug internal. Download mudah juga tersedia di Website Payroll Admin." \
              --prerelease
          fi
