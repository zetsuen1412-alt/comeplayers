name: Build CP Boost Monitor APK
on:
  push:
    paths:
      - 'CP-BoostMonitor-Android/**'
      - '.github/workflows/cp-boost-monitor-apk.yml'
  pull_request:
    paths:
      - 'CP-BoostMonitor-Android/**'
      - '.github/workflows/cp-boost-monitor-apk.yml'
  workflow_dispatch:

concurrency:
  group: monitor-native-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" || ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            (yes y || true) | "$SDKMANAGER" --licenses
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Load stable signing identity for an approved main release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SIGNING_BASE64: ${{ secrets.MONITOR_ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.MONITOR_ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SIGNING_BASE64" && -n "$SIGNING_PASSWORD" ]] || { echo 'Configure the approved persistent Android signing secrets before publishing. Existing APK remains unchanged.'; exit 1; }
          umask 077
          printf '%s' "$SIGNING_BASE64" | base64 --decode > "$RUNNER_TEMP/monitor-accounts.p12"
          printf 'MONITOR_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/monitor-accounts.p12" >> "$GITHUB_ENV"
          printf 'MONITOR_STORE_PASSWORD=%s\n' "$SIGNING_PASSWORD" >> "$GITHUB_ENV"
      - name: Compile Android APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            gradle --no-daemon -p CP-BoostMonitor-Android testDebugUnitTest assembleRelease lintRelease
            echo 'APK_FILE=CP-BoostMonitor-Android/app/build/outputs/apk/release/app-release.apk' >> "$GITHUB_ENV"
          else
            gradle --no-daemon -p CP-BoostMonitor-Android testDebugUnitTest assembleDebug assembleRelease lintDebug lintRelease
            echo 'APK_FILE=CP-BoostMonitor-Android/app/build/outputs/apk/debug/app-debug.apk' >> "$GITHUB_ENV"
          fi
      - name: Verify APK format and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$APK_FILE"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          SOUND_EXPECTED="$(sha256sum CP-BoostMonitor-Android/app/src/main/res/raw/new_order.mp3 | cut -d' ' -f1)"
          APKS=("$APK")
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            APKS+=(CP-BoostMonitor-Android/app/build/outputs/apk/release/app-release-unsigned.apk)
          fi
          for SOUND_APK in "${APKS[@]}"; do
            # Release optimization shortens ZIP paths. The named Android resource
            # remains stable and is also what the notification URI resolves.
            RESOURCE_DUMP="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump resources "$SOUND_APK")"
            SOUND_ENTRY="$(printf '%s\n' "$RESOURCE_DUMP" | awk '$1 == "resource" { sound = ($3 == "raw/new_order") } sound && $2 == "(file)" { print $3 }')"
            [[ "$SOUND_ENTRY" =~ ^res/[a-zA-Z0-9_./-]+\.mp3$ ]] || { echo 'Expected one raw/new_order music resource.'; exit 1; }
            SOUND_PACKAGED="$(unzip -p "$SOUND_APK" "$SOUND_ENTRY" | sha256sum | cut -d' ' -f1)"
            [[ "$SOUND_EXPECTED" == "$SOUND_PACKAGED" ]] || { echo 'Packaged notification music differs from the reviewed asset.'; exit 1; }
            echo "Verified notification music in $SOUND_APK ($SOUND_ENTRY)."
          done
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            CERT="$($ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p')"
            [[ "$CERT" == '6082eb26895e4cecaf6cc68b68217613e2c08bcd278f2f3f257a0fa0a512278e' ]] || { echo 'Unexpected release signing identity.'; exit 1; }
          fi
          sha256sum "$APK"
      - name: Upload verified APK for branch testing
        continue-on-error: true # GitHub Actions artifact quota is currently full
        uses: actions/upload-artifact@v4
        with:
          name: EVOGAMING-Monitor-Android-v1.8.0-verified
          path: ${{ env.APK_FILE }}
          retention-days: 14
          if-no-files-found: error
      - name: Publish same APK to website downloads
        # Publish the verified APK from main so the production download stays current.
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          APK="$APK_FILE"
          # Never replace an installed package with a different signing identity.
          OLD="website/public/downloads/cp-boost-monitor.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [[ -s "$OLD" ]]; then
            OLD_PACKAGE="$($AAPT dump badging "$OLD" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            NEW_PACKAGE="$($AAPT dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            [[ -n "$OLD_PACKAGE" && -n "$NEW_PACKAGE" ]] || { echo 'Cannot verify APK package identity.'; exit 1; }
            if [[ "$OLD_PACKAGE" == "$NEW_PACKAGE" ]]; then
              OLD_CERT="$($SIGNER verify --print-certs "$OLD" | sed -n 's/Signer #1 certificate SHA-256 digest: //p')"
              NEW_CERT="$($SIGNER verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p')"
              [[ -n "$OLD_CERT" && "$OLD_CERT" == "$NEW_CERT" ]] || { echo 'Signing key differs. Keep the published APK and configure its original signing key.'; exit 1; }
            fi
          fi
          # Preserve a Windows download commit published by the other native workflow.
          git fetch origin main
          git diff --quiet "$GITHUB_SHA" origin/main -- CP-BoostMonitor-Android .github/workflows/cp-boost-monitor-apk.yml
          git checkout -B main origin/main
          mkdir -p website/public/downloads
          cp "$APK" website/public/downloads/cp-boost-monitor.apk
          # ZIP fallback allows Android users to download from embedded browsers blocking .apk.
          cp "$APK" website/public/downloads/CP-Boost-Monitor.apk
          (cd website/public/downloads && zip -q cp-boost-monitor.zip CP-Boost-Monitor.apk)
          rm website/public/downloads/CP-Boost-Monitor.apk
          (cd website/public/downloads && sha256sum cp-boost-monitor.apk > cp-boost-monitor.apk.sha256)
          printf '{"version":"1.8.0","packageId":"id.comeplayers.boostmonitor.fh3.accounts","parallelInstall":true}\n' > website/public/downloads/cp-boost-monitor.json
          unzip -t website/public/downloads/cp-boost-monitor.zip | tail -n 1
          echo "ZIP includes the same APK verified by apksigner."
          test "$(unzip -p website/public/downloads/cp-boost-monitor.zip CP-Boost-Monitor.apk | sha256sum | cut -d' ' -f1)" = "$(sha256sum "$APK" | cut -d' ' -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f website/public/downloads/cp-boost-monitor.apk
          git add -f website/public/downloads/cp-boost-monitor.apk.sha256
          git add -f website/public/downloads/cp-boost-monitor.zip
          git add -f website/public/downloads/cp-boost-monitor.json
          if ! git diff --cached --quiet; then
            git commit -m "build(android): publish verified CP Boost Monitor APK for website admins"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Publish persistently signed Android release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="evogaming-monitor-android-v1.8.0"
          APK="$APK_FILE"
          test -s "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#EVOGAMING-Monitor-Android-v1.8.0.apk" --clobber
          else
            gh release create "$TAG" "$APK#EVOGAMING-Monitor-Android-v1.8.0.apk" \
              --target "$GITHUB_SHA" \
              --title "EVOGAMING Monitor Android" \
              --notes "Installs alongside older Monitor packages; retain the old app and its local history. Username login with admin, personal employee and shared workstation access across devices. Shared accounts select all active FH3 workers without admin privileges. order controls, net wages and immutable Tutup Buku. Foreground and background queue updates share notification delivery and deduplication. Settings shows permission/channel/battery status and provides a local music notification test. Blocked deliveries remain eligible for retry. Android may defer network polling while idle. Confirmed TAKE automatically marks ready/farming employees as working while preserving manual sleep status. Existing Payroll data stays unchanged. Photo PAUSE/CONTINUE supports repeated breaks before DONE. The additive PAUSE/CONTINUE backend migration must be approved and applied before use. Existing Payroll, Closing, signing identity and local history are preserved. Signed with a persistent private release key." \
              --prerelease
          fi
