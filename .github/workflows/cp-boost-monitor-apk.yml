name: Build CP Boost Monitor APK
on:
  push:
    paths:
      - 'CP-BoostMonitor-Android/**'
      - '.github/workflows/cp-boost-monitor-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" || ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            (yes y || true) | "$SDKMANAGER" --licenses
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android APK
        run: gradle --no-daemon -p CP-BoostMonitor-Android assembleDebug
      - name: Verify APK format and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="CP-BoostMonitor-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
      - name: Upload verified APK for branch testing
        continue-on-error: true # GitHub Actions artifact quota is currently full
        uses: actions/upload-artifact@v4
        with:
          name: CP-BoostMonitor-v1.5.0-verified-debug
          path: CP-BoostMonitor-Android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Publish isolated PR preview APK to GitHub Releases
        if: github.ref == 'refs/heads/feature/boost-monitor-mobile-assignment-20261019'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="cp-boost-monitor-v1.5-fh3-proof-preview"
          APK="CP-BoostMonitor-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#CP-BoostMonitor-v1.5-fh3-proof-PREVIEW.apk" --clobber
          else
            gh release create "$TAG" "$APK#CP-BoostMonitor-v1.5-fh3-proof-PREVIEW.apk" \
              --target "$GITHUB_SHA" \
              --title "CP Boost Monitor 1.5 FH3 proof — PREVIEW ONLY" \
              --notes "Internal development APK only. Requires staging migrations, matching website API and test Telegram group setup. Debug signature may not match the existing installation; back up local data before changing APK. Not for production work." \
              --prerelease
          fi
      - name: Publish Android v1.6 luxury preview APK
        if: github.ref == 'refs/heads/feature/cp-boost-android-luxury-ui-20261020'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="cp-boost-monitor-android-v1.6-luxury-preview"
          APK="CP-BoostMonitor-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#CP-BoostMonitor-v1.6-LUXURY-PREVIEW.apk" --clobber
          else
            gh release create "$TAG" "$APK#CP-BoostMonitor-v1.6-LUXURY-PREVIEW.apk" \
              --target "$GITHUB_SHA" --title "CP Boost Monitor Android v1.6 • Executive Luxury Preview" \
              --notes "Internal preview Android FH3 luxury redesign. APK debug may be signed differently than installed production build. Back up local status/history before installation; no Telegram photo tests on real customer orders." \
              --prerelease
          fi
      - name: Publish same APK to website downloads
        # Publish the verified APK from main so the production download stays current.
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          APK="CP-BoostMonitor-Android/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p website/public/downloads
          cp "$APK" website/public/downloads/cp-boost-monitor.apk
          # ZIP fallback allows Android users to download from embedded browsers blocking .apk.
          cp "$APK" website/public/downloads/CP-Boost-Monitor.apk
          (cd website/public/downloads && zip -q cp-boost-monitor.zip CP-Boost-Monitor.apk)
          rm website/public/downloads/CP-Boost-Monitor.apk
          (cd website/public/downloads && sha256sum cp-boost-monitor.apk > cp-boost-monitor.apk.sha256)
          unzip -t website/public/downloads/cp-boost-monitor.zip | tail -n 1
          echo "ZIP includes the same APK verified by apksigner."
          test "$(unzip -p website/public/downloads/cp-boost-monitor.zip CP-Boost-Monitor.apk | sha256sum | cut -d' ' -f1)" = "$(sha256sum "$APK" | cut -d' ' -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f website/public/downloads/cp-boost-monitor.apk
          git add -f website/public/downloads/cp-boost-monitor.apk.sha256
          git add -f website/public/downloads/cp-boost-monitor.zip
          if ! git diff --cached --quiet; then
            git commit -m "build(android): publish verified CP Boost Monitor APK for website admins"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Publish internal debug APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="cp-boost-monitor-android-v1.5-fh3-proof-debug"
          APK="CP-BoostMonitor-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#CP-BoostMonitor-v1.5-fh3-proof-debug.apk" --clobber
          else
            gh release create "$TAG" "$APK#CP-BoostMonitor-v1.5-fh3-proof-debug.apk" \
              --target "$GITHUB_SHA" \
              --title "CP Boost Monitor Android v1.5 FH3 Screenshot Proof (internal debug)" \
              --notes "APK debug internal. Download mudah juga tersedia di Website Payroll Admin." \
              --prerelease
          fi
