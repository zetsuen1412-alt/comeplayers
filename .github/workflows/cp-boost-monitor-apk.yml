name: Build CP Boost Monitor APK
on:
  push:
    paths:
      - 'CP-BoostMonitor-Android/**'
      - '.github/workflows/cp-boost-monitor-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" || ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            (yes y || true) | "$SDKMANAGER" --licenses
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon -p CP-BoostMonitor-Android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CP-BoostMonitor-debug-APK
          path: CP-BoostMonitor-Android/app/build/outputs/apk/debug/app-debug.apk
