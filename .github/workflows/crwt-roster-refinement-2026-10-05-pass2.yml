name: CRWT Roster Refinement Pass2 2026-10-05
on:
  workflow_dispatch:
  push:
    branches:
      - codex/crazy-rich-web-v30
    paths:
      - .github/workflows/crwt-roster-refinement-2026-10-05-pass2.yml
      - Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-refinement-2026-10-05-pass2/**
      - Crazy-Rich-World-Tour-Unity-28.0/Web30/checkpoints/2026-10-05-roster-refinement-pass2/**
      - CRWT_ROSTER_REFINEMENT_PASS2_RESUME_ID.md
permissions:
  contents: read
env:
  # Final pass2 five accessory models/manifest/gallery build, supplied by root on 05 October.
  # The builder checks this against the frozen source receipt and generated bytes.
  ROSTER_GALLERY_SHA256: 5e607a6d1a077e9020405ec3a104caf7fc19a099daa9bb5ec0e4cf81c2b9ff9d
  ROSTER: Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-refinement-2026-10-05-pass2
  INVENTORY: Crazy-Rich-World-Tour-Unity-28.0/Web30/checkpoints/2026-10-05-roster-refinement-pass2/inventory.json
jobs:
  verify-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize exact source Git blobs without checkout line-ending filters
        run: >-
          python3 "$ROSTER/tools/materialize_git_snapshot.py" --repo-root . --inventory "$INVENTORY"
          --out-dir crwt-oct05-pass2-raw-source --expected-commit "$GITHUB_SHA" --receipt crwt-oct05-pass2-materialization.json
      - name: Verify complete source inventory and every frozen baseline blob
        working-directory: crwt-oct05-pass2-raw-source
        run: >-
          python3 "$ROSTER/tools/verify_checkpoint.py" --root .
          --manifest "$INVENTORY" --strict-bytes --receipt crwt-oct05-pass2-source-verification.json
      - name: Verify ten actual candidate GLBs without generation
        working-directory: crwt-oct05-pass2-raw-source
        run: >-
          python3 "$ROSTER/tools/validate_roster_candidate.py" "$ROSTER/review-manifest.json"
          --receipt crwt-oct05-pass2-roster-validation.json
      - name: Rebuild exact offline gallery and preserve frozen receipt bytes
        working-directory: crwt-oct05-pass2-raw-source
        run: >-
          python3 "$ROSTER/tools/rebuild_and_verify_gallery.py" --roster "$ROSTER"
          --build-dir crwt-oct05-pass2-gallery-build --expected-sha256 "$ROSTER_GALLERY_SHA256"
      - name: Archive complete preserved source and compact Oct05 review assets
        working-directory: crwt-oct05-pass2-raw-source
        run: >-
          python3 "$ROSTER/tools/archive_source_checkpoint.py" --root . --inventory "$INVENTORY"
          --roster "$ROSTER" --output crwt-roster-refinement-2026-10-05-pass2-source.zip
          --receipt crwt-roster-refinement-2026-10-05-pass2-source-receipt.json
          --commit "$GITHUB_SHA" --expected-gallery-sha256 "$ROSTER_GALLERY_SHA256"
      - name: Save private portable source checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: CRWT-Roster-Refinement-Pass2-Source-2026-10-05-${{ github.sha }}
          path: |
            crwt-oct05-pass2-raw-source/crwt-roster-refinement-2026-10-05-pass2-source.zip
            crwt-oct05-pass2-raw-source/crwt-roster-refinement-2026-10-05-pass2-source-receipt.json
            crwt-oct05-pass2-raw-source/crwt-oct05-pass2-source-verification.json
            crwt-oct05-pass2-raw-source/crwt-oct05-pass2-roster-validation.json
            crwt-oct05-pass2-materialization.json
          retention-days: 7
          if-no-files-found: error
