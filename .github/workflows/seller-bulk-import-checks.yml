name: Seller bulk import checks
on:
  push:
    branches: [feat/seller-bulk-products-5000-20260920]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Resolve matching mobile crypto dependencies
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const web = require('./package.json');
          const mobile = require('../comeplayers-apps/apps/mobile/package.json');
          for (const name of ['hpke', '@panva/hpke-noble', '@noble/curves', '@noble/ciphers', '@noble/hashes']) {
            if (web.dependencies[name] !== mobile.dependencies[name]) throw new Error(`Dependency version mismatch: ${name}`);
            const target = path.resolve('node_modules', name);
            const link = path.resolve('../comeplayers-apps/apps/mobile/node_modules', name);
            if (!fs.existsSync(target)) throw new Error(`Locked dependency missing: ${name}`);
            fs.mkdirSync(path.dirname(link), { recursive: true });
            if (!fs.existsSync(link)) fs.symlinkSync(target, link, 'dir');
          }
          NODE
      - name: Typecheck
        run: npm run typecheck
      - name: Spreadsheet tests
        run: npx --no-install tsx --test tests/bulkListingSpreadsheet.test.ts
      - name: Production build
        run: npm run build
