name: CRWT Alexia Side Colors 2026-10-06
on:
  workflow_dispatch:
  push:
    branches:
      - codex/crazy-rich-web-v30
    paths:
      - .github/workflows/crwt-alexia-side-colors-2026-10-06.yml
      - Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-side-colors-2026-10-06/**
      - CRWT_ALEXIA_SIDE_COLORS_RESUME_ID.md
permissions:
  contents: read
env:
  ROSTER: Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-side-colors-2026-10-06
  BASELINE_ROSTER: Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-hair-sculpt-2026-10-05
jobs:
  verify-side-colors-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize raw exact HEAD blobs, split gallery parts and prior comparison input
        run: >-
          python3 -B "$ROSTER/tools/materialize_side_colors_source.py" --repo-root .
          --out-dir crwt-side-colors-raw --expected-commit "$GITHUB_SHA"
          --receipt crwt-side-colors-materialization.json
      - name: Verify source pins, unchanged geometry, protected front colors and existing local native certificates
        working-directory: crwt-side-colors-raw
        run: >-
          python3 -B "$ROSTER/tools/verify_side_colors_source.py" --roster "$ROSTER"
          --baseline-roster "$BASELINE_ROSTER" --inventory "$ROSTER/source-inventory.json"
          --pins "$ROSTER/source-pins.json" --receipt ../crwt-side-colors-source-verification.json
      - name: Validate all ten actual GLBs without generation
        working-directory: crwt-side-colors-raw
        run: >-
          python3 -B "$ROSTER/tools/validate_roster_candidate.py" "$ROSTER/review-manifest.json"
          --receipt ../crwt-side-colors-roster-validation.json
      - name: Rebuild exact gallery into fresh external output and compare frozen JSON receipt
        working-directory: crwt-side-colors-raw
        run: >-
          python3 -B "$ROSTER/tools/rebuild_side_colors_gallery.py" --roster "$ROSTER"
          --build-dir ../crwt-side-colors-gallery-build --receipt ../crwt-side-colors-gallery-verification.json
      - name: Verify concatenated two-part ZIP SHA and one-entry CRC then restore fresh HTML
        working-directory: crwt-side-colors-raw
        run: >-
          python3 -B "$ROSTER/tools/restore_offline_gallery.py" --archive "$ROSTER/OFFLINE-GALLERY.zip"
          --pins "$ROSTER/source-pins.json" --out ../crwt-side-colors-gallery-restore/BUKA-REVIEW-MODEL.html
          --receipt ../crwt-side-colors-gallery-restore.json
      - name: Save private side-colors source and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: CRWT-Alexia-Side-Colors-2026-10-06-${{ github.sha }}
          path: |
            crwt-side-colors-raw/Crazy-Rich-World-Tour-Unity-28.0/Web30/production/reconstruction/roster-side-colors-2026-10-06
            crwt-side-colors-gallery-build
            crwt-side-colors-gallery-restore
            crwt-side-colors-materialization.json
            crwt-side-colors-source-verification.json
            crwt-side-colors-roster-validation.json
            crwt-side-colors-gallery-verification.json
            crwt-side-colors-gallery-restore.json
          retention-days: 7
          if-no-files-found: error
