name: CRWT Character Sculpt Import
on:
  push:
    branches: [codex/crazy-rich-web-v30]
    paths:
      - Crazy-Rich-World-Tour-Unity-28.0/Web30/production/sculpt-v1-import.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crwt-character-sculpt-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'zetsuen1412-alt/comeplayers' && github.ref == 'refs/heads/codex/crazy-rich-web-v30'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify original asset package and import only CRWT preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          INPUT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, re, struct, time, urllib.request, urllib.parse, urllib.error, zipfile
          repo = os.environ['GH_REPOSITORY']
          assert repo == 'zetsuen1412-alt/comeplayers'
          api = 'https://api.github.com/repos/' + repo
          branch = 'codex/crazy-rich-web-v30'
          root = 'Crazy-Rich-World-Tour-Unity-28.0/Web30'
          def request(path, data=None, method=None):
              payload = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(api + path, data=payload, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'CRWT-Asset-Importer'})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.load(r)
          item = request('/contents/' + root + '/production/sculpt-v1-import.json?ref=' + os.environ['INPUT_SHA'])
          config = json.loads(base64.b64decode(item['content']))
          url = urllib.parse.urlparse(config['package_url'])
          assert url.scheme == 'https' and url.hostname == 'd2ol7oe51mr4n9.cloudfront.net'
          assert url.path.startswith('/user_3JlC5msQOwY9G4pYlmpaOXt3RfP/') and url.path.endswith('.zip')
          assert re.fullmatch(r'[0-9a-f]{64}', config['sha256'])
          with urllib.request.urlopen(config['package_url'], timeout=120) as r:
              package = r.read(100 * 1024 * 1024 + 1)
          assert len(package) <= 100 * 1024 * 1024, 'Package exceeds import limit'
          assert hashlib.sha256(package).hexdigest() == config['sha256'], 'Package checksum mismatch'
          allowed = {'roster.glb', 'source.blend', 'preview.png', 'clips.json', 'README_ID.md'}
          out = pathlib.Path('/tmp/crwt-sculpt-artifact'); out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(package)) as z:
              assert set(z.namelist()) == allowed, 'Unexpected archive files'
              assert all(v.file_size <= 100 * 1024 * 1024 for v in z.infolist())
              assert sum(v.file_size for v in z.infolist()) <= 160 * 1024 * 1024
              files = {name: z.read(name) for name in allowed}
          glb = files['roster.glb']
          magic, version, size = struct.unpack_from('<III', glb)
          assert magic == 0x46546C67 and version == 2 and size == len(glb)
          json_size, chunk_type = struct.unpack_from('<II', glb, 12)
          assert chunk_type == 0x4E4F534A
          doc = json.loads(glb[20:20+json_size])
          ids = {'alexia','rindi','kairo','luna','nox','atlas','zeno','yuna','mochi','pip'}
          assert ids.issubset({n.get('name') for n in doc['nodes']})
          assert len(doc.get('skins', [])) == 10 and len(doc.get('images', [])) >= 10
          assert len(doc.get('animations', [])) >= 10
          assert files['source.blend'].startswith(b'BLENDER')
          assert files['preview.png'].startswith(b'\x89PNG\r\n\x1a\n')
          clipmeta = json.loads(files['clips.json'])
          assert set(clipmeta['segments']) == {'Idle','Walk','Jump','Skill','Win','Lose'}
          assert clipmeta['visual_final_approved'] is False
          for name, data in files.items(): (out/name).write_bytes(data)
          report = {'status':'structural_checks_passed', 'visual_final_approved':False,
              'online_game_replaced':False, 'characters':sorted(ids), 'skins':len(doc['skins']),
              'images':len(doc['images']), 'animation_timelines':len(doc['animations']),
              'package_sha256':config['sha256'], 'glb_sha256':hashlib.sha256(glb).hexdigest()}
          (out/'qa-report.json').write_text(json.dumps(report, indent=2))
          # The editable Blender source stays in the downloadable artifact, not the website bundle.
          entries = []
          for name in ['roster.glb','preview.png','clips.json','README_ID.md']:
              blob = request('/git/blobs', {'content':base64.b64encode(files[name]).decode(),'encoding':'base64'})['sha']
              for prefix in [root + '/client', 'website/public/games/crazy-rich-world-tour/client']:
                  entries.append({'path':prefix+'/assets/characters/sculpt-v1/'+name,'mode':'100644','type':'blob','sha':blob})
          for attempt in range(3):
              parent = request('/git/ref/heads/' + branch)['object']['sha']
              base = request('/git/commits/' + parent)['tree']['sha']
              tree = request('/git/trees', {'base_tree':base,'tree':entries})['sha']
              commit = request('/git/commits', {'message':'feat(crwt): import ten textured rigged character sculpts (WIP)', 'tree':tree,'parents':[parent]})['sha']
              try:
                  request('/git/refs/heads/' + branch, {'sha':commit,'force':False}, 'PATCH')
                  print('IMPORTED_COMMIT=' + commit)
                  report['commit'] = commit
                  (out/'qa-report.json').write_text(json.dumps(report, indent=2))
                  break
              except urllib.error.HTTPError as e:
                  if e.code not in (409,422) or attempt == 2: raise
                  time.sleep(2)
          print(json.dumps(report, indent=2))
          PY
      - name: Retain editable source, real meshes and QA files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CRWT-Ten-Character-Sculpts-WIP
          path: /tmp/crwt-sculpt-artifact/
          if-no-files-found: error
          retention-days: 30
