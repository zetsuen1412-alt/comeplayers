name: Verify Crazy Rich Unity anime visual pass
on:
  push:
    branches: [codex/crazy-rich-anime-unity]
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/crazy-rich-anime-unity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Crazy-Rich-World-Tour-Unity-28.0/package-lock.json
      - name: Install test dependencies
        working-directory: Crazy-Rich-World-Tour-Unity-28.0
        run: npm ci --ignore-scripts
      - name: Regression tests
        working-directory: Crazy-Rich-World-Tour-Unity-28.0
        shell: bash
        run: |
          set -euo pipefail
          npm test
          pwsh -NoProfile -File tests/check-client.ps1
          pwsh -NoProfile -File tests/check-actions.ps1
          pwsh -NoProfile -File tests/check-board.ps1
          pwsh -NoProfile -File tests/check-csharp-syntax.ps1
      - name: Diff safety
        shell: bash
        run: |
          git diff --check c92db724692d79bf56097d4dbe09ea1729afa311..HEAD
          test -z "$(git diff --name-only c92db724692d79bf56097d4dbe09ea1729afa311..HEAD -- Crazy-Rich-World-Tour-Unity-28.0/Assets/CRWT/Scripts/Net Crazy-Rich-World-Tour-Unity-28.0/Assets/CRWT/Scripts/Network Crazy-Rich-World-Tour-Unity-28.0/Assets/CRWT/Scripts/Core/CrwtApi.cs Crazy-Rich-World-Tour-Unity-28.0/supabase)"
