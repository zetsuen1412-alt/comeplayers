name: Crazy Rich Web v30 Checks

on:
  push:
    branches:
      - codex/crazy-rich-web-v30
    paths:
      - "Crazy-Rich-World-Tour-Unity-28.0/Web30/**"
      - "website/app/games/crazy-rich-world-tour/**"
      - "website/public/crazy-rich-world-tour/**"
      - "website/public/games/crazy-rich-world-tour/**"
      - "website/tests/crazy-rich-web-v30.test.ts"
      - ".github/workflows/crazy-rich-web-v30.yml"
  pull_request:
    paths:
      - "Crazy-Rich-World-Tour-Unity-28.0/Web30/**"
      - "website/app/games/crazy-rich-world-tour/**"
      - "website/public/crazy-rich-world-tour/**"
      - "website/public/games/crazy-rich-world-tour/**"
      - "website/tests/crazy-rich-web-v30.test.ts"
      - ".github/workflows/crazy-rich-web-v30.yml"

jobs:
  browser-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            comeplayers-apps/package-lock.json
      - name: Install shared app workspace dependencies
        working-directory: comeplayers-apps
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify project folder matches website publish mirror
        working-directory: ..
        run: node Crazy-Rich-World-Tour-Unity-28.0/Web30/tools/publish.mjs --check
      - run: npx tsx --test tests/crazy-rich-web-v30.test.ts
      - run: npm run typecheck
      - name: Run full Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://uyehruetoxedmookyfcd.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: crwt-build-only-placeholder
          NEXT_PUBLIC_SITE_URL: https://comeplayers.com
