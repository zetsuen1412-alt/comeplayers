name: Verify FH3-only payroll roster for Android
on:
  pull_request:
    paths:
      - 'website/features/payroll/lib/mobile-roster.ts'
      - 'website/app/api/admin/payroll/mobile/roster/route.ts'
      - 'website/tests/payroll-mobile-roster.test.ts'
      - '.github/workflows/cp-boost-fh3-tests.yml'
  push:
    branches: [main]
    paths:
      - 'website/features/payroll/lib/mobile-roster.ts'
      - 'website/app/api/admin/payroll/mobile/roster/route.ts'
      - 'website/tests/payroll-mobile-roster.test.ts'
      - '.github/workflows/cp-boost-fh3-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify that only FH3 employees reach the APK
        run: npx --no-install tsx --test tests/payroll-mobile-roster.test.ts
